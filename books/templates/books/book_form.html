<!DOCTYPE html>
<html>
<head>
    <title>Book Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }
        h1 {
            color: purple;
        }
        form {
            background: white;
            padding: 20px;
            margin: 30px auto;
            width: 300px;
        }
        input {
            padding: 10px;
            margin: 8px;
            width: 85%;
        }
        button {
            background: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Book Details</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title"
               placeholder="Book Title"
               value="{{ book.title|default:'' }}" required>

        <input type="text" name="author"
               placeholder="Author"
               value="{{ book.author|default:'' }}" required>

        <input type="number" name="price"
               placeholder="Price" step="0.01" min="0"
               value="{{ book.price|default:'' }}" required>

        <button type="submit">Save Book</button>
    </form>

    <a href="{% url 'book_list' %}">Back to Books</a>
</body>
</html>
