<!DOCTYPE html>
<html>
<head>
    <title>Book Management System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }
        h1 {
            color: purple;
        }
        table {
            margin: auto;
            background: white;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }
        th {
            background: purple;
            color: white;
        }
        a {
            color: purple;
        }
    </style>
</head>
<body>
    <h1>Book Management System</h1>

    <p><a href="{% url 'book_create' %}">Add New Book</a></p>

    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>
                <a href="{% url 'book_update' book.id %}">Edit</a>
                |
                <a href="{% url 'book_delete' book.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No books available.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
