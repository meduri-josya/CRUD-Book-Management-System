<!DOCTYPE html>
<html>
<head>
    <title>Delete Book</title>
</head>
<body style="text-align:center; font-family:Arial;">
    <h1>Delete Book</h1>

    <p>Are you sure you want to delete "{{ book.title }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'book_list' %}">Cancel</a>
</body>
</html>
